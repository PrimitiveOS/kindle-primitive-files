name: Release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    permissions:
      contents: write
    uses: PrimitiveOS/kindle-primitive-build/.github/workflows/package.yml@6235c4d7327fbcfce74fc68ec06ae3c4f9c4665d
    with:
      id: primitive-files
      dir: files
      binary-crate: files-kindle
      arches: armhf
      firmware-min: "5.16.3"
      docs-licence-file: LICENSE-DOCS
      sibling-tools-ref: 9f7e33163a5e2595684a8e4624fa7fc0d0007cbd
